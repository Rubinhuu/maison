<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12191A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maison">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#1B2A2E; --muted:#5B6B6D; --line:#D6DFDC;
  --accent:#1F6F6A; --accent-soft:#D3EAE6; --accent-ink:#FFFFFF;
  --late:#B3261E; --shadow:0 1px 0 rgba(27,42,46,.06);
  --display:'Bricolage Grotesque', 'Manrope', system-ui, sans-serif;
  --body:'Manrope', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12191A; --surface:#1B2425; --ink:#E4EDEB; --muted:#93A4A5; --line:#2A3637;
    --accent:#58B9AF; --accent-soft:#1E3735; --accent-ink:#0E1A19; --late:#F2867D;
    --shadow:none; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 150px)}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.top h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;letter-spacing:-.015em}
.top p{margin:3px 0 0;color:var(--muted);font-size:14px}
.me{border:0;background:none;padding:0;border-radius:50%}

/* Avatars */
.av{--c:#888;width:30px;height:30px;flex:none;border-radius:50%;display:inline-grid;place-items:center;background:var(--c);font-size:16px;line-height:1;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.av.lg{width:42px;height:42px;font-size:22px}
.av.sm{width:22px;height:22px;font-size:12px}

/* Panneau d'état d'une pièce : l'élément fort de l'app */
.slab{--c:var(--accent);border-radius:24px;padding:16px 18px 14px;background:var(--accent-soft);color:var(--ink);position:relative}
.slab.busy{background:var(--c);color:#fff}
.slab .room{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;opacity:.85}
.slab .state{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.025em;margin:14px 0 4px}
.slab .detail{font-size:15px;margin:0 0 14px;opacity:.92;min-height:1.45em}
.slab .strip{background:rgba(27,42,46,.1)}
.slab.busy .strip{background:rgba(255,255,255,.22)}
.slab.busy .strip i{background:rgba(255,255,255,.92)!important}
.slab.busy .strip b{background:#fff}
.slab .ticks{opacity:.7}
.slab .act{position:absolute;right:12px;top:10px}
.mini{border:0;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;background:var(--surface);color:var(--ink)}
.slab.busy .mini{background:rgba(255,255,255,.95);color:#1B2A2E}
.rooms{display:grid;gap:12px}
.rooms .slab .state{font-size:36px;margin-top:10px}

/* Frise horaire */
.strip{position:relative;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.strip i{position:absolute;top:0;bottom:0;border-radius:999px;min-width:4px}
.strip b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);border-radius:2px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:inherit;opacity:.6;margin-top:4px;font-variant-numeric:tabular-nums}

/* Blocs */
.block{background:var(--surface);border-radius:20px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.block h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 10px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block h2 a,.block h2 button{font-family:var(--body);font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;background:none;border:0;padding:0}
.muted{color:var(--muted)}
.empty{color:var(--muted);margin:6px 0 2px;font-size:15px}
ul.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0;padding-top:4px}
.rows .grow{flex:1;min-width:0}
.rows .t{font-weight:600;overflow-wrap:anywhere}
.rows .m{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:1px}
.rows .m .late{color:var(--late);font-weight:600}
.time{font-variant-numeric:tabular-nums;font-weight:700}

/* Boutons et puces */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:0 18px}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.danger{background:transparent;color:var(--late);box-shadow:inset 0 0 0 1.5px currentColor}
.btn:disabled{opacity:.45}
.btn + .btn{margin-top:10px}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:14px}
.small{border:0;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.small.neutral{background:var(--bg);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scroller{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.seg .n{font-variant-numeric:tabular-nums;opacity:.7;font-weight:500}

/* Bouton d'action fixe au-dessus de la barre */
.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 66px);padding:0 16px 10px;pointer-events:none;z-index:4}
.dock .btn{max-width:528px;margin:0 auto;pointer-events:auto;box-shadow:0 6px 18px rgba(31,111,106,.28)}

/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 0;position:relative}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--late);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

/* Lave-vaisselle */
.cycle{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 18px}
.cycle div{border-radius:14px;padding:10px 4px;background:var(--bg);text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.cycle div svg{display:block;margin:0 auto 4px;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cycle div.on{background:var(--accent);color:var(--accent-ink)}
.dishstate{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:0 0 4px;letter-spacing:-.02em}
.turn{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:14px;padding:10px 12px;margin:14px 0 4px;font-size:15px}
.bars li{gap:10px}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;border-radius:4px}

/* Tâches */
.check{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.check svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check.done svg{opacity:1}
.tbody{border:0;background:none;padding:0;text-align:left;flex:1;min-width:0}
.donelist .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}

/* Feuilles (bottom sheets) */
.scrim{position:fixed;inset:0;background:rgba(10,18,19,.45);z-index:20;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet .in{max-width:560px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 4px;letter-spacing:-.015em}
.sheet .lead{margin:0 0 16px;color:var(--muted)}
.field{display:block;margin:0 0 16px}
.field > span{display:block;font-weight:600;font-size:14px;margin-bottom:7px}
.input{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:12px 14px;font-size:16px}
.input:focus{outline:none;border-color:var(--accent)}
input[type=time].input,input[type=date].input{-webkit-appearance:none;appearance:none}
.summary{font-family:var(--display);font-weight:700;font-size:26px;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.err{color:var(--late);font-weight:600;font-size:14px;min-height:1.4em;margin:0 0 10px}
.hint{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 12px}
.member-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.member-edit .input.emoji{width:58px;text-align:center;padding:0;font-size:22px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}

/* Choix du profil */
.pick{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.pick h1{font-family:var(--display);font-size:40px;margin:0 0 6px;letter-spacing:-.02em}
.pick .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.pick .who{border:0;border-radius:22px;padding:20px 12px;background:var(--c);color:#fff;font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:8px}
.pick .who span{font-size:40px;line-height:1}

.demo{font-size:13px;color:var(--muted);text-align:center;margin:22px 0 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 140px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.loading{display:grid;place-items:center;min-height:70vh;color:var(--muted)}
.dish-actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:16px}
.dish-actions .btn + .btn{margin-top:0}
.dish-mini{display:flex;flex-direction:column;gap:6px}
.slab .go{display:block;width:100%;min-height:46px;margin-top:14px;border:0;border-radius:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.slab.busy .go{background:rgba(255,255,255,.95);color:#1B2A2E}
/* Parents : appel et relances */
.call{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin:0 0 14px}
.call .btn + .btn{margin-top:0}
.bell{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;padding:0}
.bell svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.turn .grow{flex:1}
.mini-seg{flex:none;padding:3px;gap:2px;background:var(--bg);box-shadow:none}
.mini-seg button{flex:none;padding:6px 10px;font-size:13px}

/* Pas de rafraîchissement natif d'Android : on gère le nôtre */
html{overscroll-behavior-y:none}
html.sheet-open,html.sheet-open body{overflow:hidden}
.sheet{overscroll-behavior:contain;touch-action:pan-y}
.sheet .in{position:relative}
.x{position:absolute;right:-6px;top:-4px;width:40px;height:40px;border:0;border-radius:50%;background:var(--bg);display:grid;place-items:center;padding:0;color:var(--muted)}
.x svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.sheet h2{padding-right:44px}
.scroller.in-sheet{margin:0 -18px;padding:0 18px 4px}

/* Indicateur "tirer pour rafraîchir" */
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6px);z-index:15;width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18);opacity:0;transform:translate(-50%,-46px);pointer-events:none}
#ptr svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
#ptr.armed svg{transform:rotate(180deg)}
#ptr.spin svg{animation:spin .8s linear infinite}
#ptr:not(.armed):not(.spin){transition:transform .2s,opacity .2s}

/* Profil */
.me-row li{padding-top:0}
.av.xl{width:84px;height:84px;font-size:46px}
.prof-preview{display:flex;justify-content:center;margin:4px 0 18px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{aspect-ratio:1;border:0;border-radius:12px;background:var(--bg);font-size:22px;padding:0;display:grid;place-items:center}
.emojis button[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--accent);background:var(--accent-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:40px;height:40px;border-radius:50%;border:0;background:var(--c);padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--c)}

/* Code à 4 chiffres */
.pin-dots{display:flex;justify-content:center;gap:16px;margin:10px 0 6px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.pin-dots.shake{animation:shake .35s}
.pin-err{text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{height:62px;border:0;border-radius:18px;background:var(--bg);font-size:26px;font-weight:600;display:grid;place-items:center}
.pad button:active{background:var(--accent-soft)}
.pad svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading">Chargement…</div></div>
<div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script type="module">
/* ============================================================
   Maison — planning de la maison pour 4 personnes
   ============================================================ */
const cfg = window.MAISON_CONFIG || {};
const DEMO = !cfg.firebase;
const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
const MIN = 6e4, HOUR = 36e5, DAY = 864e5;

const DEFAULT_MEMBERS = [
  { id: 'p1', name: 'Personne 1', emoji: '🦊', color: '#2F62C9' },
  { id: 'p2', name: 'Personne 2', emoji: '🐻', color: '#C2620E' },
  { id: 'p3', name: 'Personne 3', emoji: '🐼', color: '#B8336A' },
  { id: 'p4', name: 'Personne 4', emoji: '🐸', color: '#23855A' },
];
const ROOMS = {
  sdb:    { name: 'Salle de bain', the: 'la salle de bain', dur: 20 },
  bureau: { name: 'Bureau',        the: 'le bureau',        dur: 60 },
};
const DURATIONS = [10, 15, 20, 30, 45, 60, 90, 120];
const RECUR = { jour: 'Chaque jour', semaine: 'Chaque semaine', mois: 'Chaque mois' };
// Chaque état propose ses boutons. "J'ai rempli" peut se répéter : l'état ne change pas.
const DISH = {
  remplir: { label: 'À remplir', state: 'À remplir',         actions: [['fill', "J'ai rempli", 'Rempli'], ['launch', 'Plein et lancé', 'Lancé']] },
  lance:   { label: 'En cours',  state: 'En train de laver', actions: [['done', 'Il est terminé', 'Terminé']] },
  propre:  { label: 'À vider',   state: 'Propre, à vider',   actions: [['empty', "Je l'ai vidé", 'Vidé']] },
};
const DISH_LAST = { fill: 'Rempli par', launch: 'Lancé par', done: 'Terminé, noté par', empty: 'Vidé par' };
const DISH_LOG = { rempli: ['a rempli', 'as rempli'], lance: ['a lancé', 'as lancé'], vide: ['a vidé', 'as vidé'] };

const S = {
  members: DEFAULT_MEMBERS, bookings: [], tasks: [], dishlog: [], dish: null,
  me: localStorage.getItem('maison.me'),
  view: (location.hash.slice(1) || 'accueil'),
  day: { sdb: dayStart(Date.now()), bureau: dayStart(Date.now()) },
  taskFilter: 'moi', loaded: false,
};
let store;

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function dayStart(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function addDays(t, n) { const d = new Date(t); d.setDate(d.getDate() + n); return dayStart(d); }
function addPeriod(t, p) {
  const d = new Date(t);
  if (p === 'jour') d.setDate(d.getDate() + 1);
  else if (p === 'semaine') d.setDate(d.getDate() + 7);
  else if (p === 'mois') d.setMonth(d.getMonth() + 1);
  return dayStart(d);
}
const fmtT = t => { const d = new Date(t); return d.getHours() + 'h' + String(d.getMinutes()).padStart(2, '0'); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function dayName(t) {
  const t0 = dayStart(Date.now());
  if (t === t0) return "aujourd'hui";
  if (t === addDays(t0, 1)) return 'demain';
  if (t === addDays(t0, -1)) return 'hier';
  const sameWeekish = Math.abs(t - t0) < 6 * DAY;
  return new Date(t).toLocaleDateString('fr-CH', sameWeekish ? { weekday: 'long' } : { weekday: 'short', day: 'numeric', month: 'short' });
}
function when(t) {
  const diff = Date.now() - t;
  if (diff < 60 * MIN) return diff < 2 * MIN ? "à l'instant" : `il y a ${Math.round(diff / MIN)} min`;
  return `${dayName(dayStart(t))} ${fmtT(t)}`;
}
const member = id => S.members.find(m => m.id === id) || { id, name: '?', emoji: '·', color: '#8A9799' };

/* ---------- stockage : Firestore ou démo locale ---------- */
async function firestoreStore() {
  const [{ initializeApp }, fs, au] = await Promise.all([
    import(FB + 'firebase-app.js'), import(FB + 'firebase-firestore.js'), import(FB + 'firebase-auth.js'),
  ]);
  const app = initializeApp(cfg.firebase);
  await au.signInAnonymously(au.getAuth(app));
  let db;
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch { db = fs.getFirestore(app); }
  const base = ['familles', cfg.famille || 'maison'];
  const col = n => fs.collection(db, ...base, n);
  const docRef = n => fs.doc(db, ...base, 'etat', n);
  return {
    listen: (n, cb) => fs.onSnapshot(col(n), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })))),
    listenDoc: (n, cb) => fs.onSnapshot(docRef(n), s => cb(s.exists() ? s.data() : null)),
    add: (n, o) => fs.addDoc(col(n), o).then(r => r.id),
    update: (n, id, o) => fs.updateDoc(fs.doc(col(n), id), o),
    remove: (n, id) => fs.deleteDoc(fs.doc(col(n), id)),
    setDoc: (n, o) => fs.setDoc(docRef(n), o, { merge: true }),
    // coupe et rétablit la connexion : force Firestore à renvoyer l'état à jour
    refresh: async () => { await fs.disableNetwork(db); await fs.enableNetwork(db); },
  };
}

function localStore() {
  const KEY = 'maison.demo.v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };
  let db = read() || seedDemo();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
  save();
  const subs = {};
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel('maison-demo') : null;
  const value = key => key.startsWith('doc:') ? (db.docs[key.slice(4)] ?? null)
    : Object.entries(db.cols[key] || {}).map(([id, v]) => ({ id, ...v }));
  const emit = key => (subs[key] || []).forEach(cb => cb(value(key)));
  const changed = key => { save(); emit(key); bc?.postMessage(key); };
  if (bc) bc.onmessage = e => { db = read() || db; emit(e.data); };
  const on = (key, cb) => { (subs[key] ??= new Set()).add(cb); cb(value(key)); return () => subs[key].delete(cb); };
  return {
    listen: on,
    listenDoc: (n, cb) => on('doc:' + n, cb),
    add: async (n, o) => { const id = Math.random().toString(36).slice(2, 10); (db.cols[n] ??= {})[id] = o; changed(n); return id; },
    update: async (n, id, o) => { if (db.cols[n]?.[id]) Object.assign(db.cols[n][id], o); changed(n); },
    remove: async (n, id) => { delete db.cols[n]?.[id]; changed(n); },
    setDoc: async (n, o) => { db.docs[n] = { ...(db.docs[n] || {}), ...o }; changed('doc:' + n); },
  };
}

const pushReady = () => !!(cfg.pushServer && cfg.pushKey && cfg.vapidPublic);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

// Renvoie la liste des profils réellement notifiés (null si le serveur n'est pas configuré ou injoignable)
function notify({ title, body, to = null, tag }) {
  if (!pushReady()) return Promise.resolve(null);
  return fetch(cfg.pushServer.replace(/\/$/, '') + '/notify', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: cfg.pushKey, from: S.me, to, title, body, tag, url: location.href.split('#')[0] }),
  }).then(r => r.json()).then(j => [...new Set((j.sent || []).filter(s => s.status >= 200 && s.status < 300).map(s => s.user))]).catch(() => null);
}

/* ---------- rôles parent / enfant ---------- */
const isParent = id => member(id).role === 'parent';
const iAmParent = () => isParent(S.me);
// Tant qu'aucun parent n'est défini, n'importe qui peut faire la première attribution
const canSetRoles = () => iAmParent() || !S.members.some(m => m.role === 'parent');
const kids = () =>S.members.filter(m => m.role === 'enfant').map(m => m.id);
const listNames = ids => { const n = ids.map(id => member(id).name); return n.length < 2 ? (n[0] || '') : n.slice(0, -1).join(', ') + ' et ' + n.at(-1); };
// Envoie un message d'un parent et dit clairement qui l'a reçu
async function send(to, title, body, tag) {
  if (!to.length) { toast('Choisis au moins une personne'); return; }
  const got = await notify({ title, body, to, tag });
  if (got === null) { toast('Envoi impossible : notifications pas configurées'); return; }
  const missed = to.filter(id => !got.includes(id));
  if (!got.length) toast(`${listNames(missed)} n'${missed.length > 1 ? 'ont' : 'a'} pas activé les notifications`);
  else if (missed.length) toast(`Envoyé à ${listNames(got)}. Pas reçu : ${listNames(missed)}`);
  else toast(`Envoyé à ${listNames(got)}`);
}
// Anti-spam : un même rappel au maximum toutes les 2 minutes
const lastNudge = {};
function nudge(key, to, title, body) {
  if (Date.now() - (lastNudge[key] || 0) < 2 * MIN) { toast('Déjà relancé il y a un instant'); return; }
  lastNudge[key] = Date.now();
  send(to, title, body, 'rappel-' + key);
}
// Notification envoyée plus tard par le serveur (même si personne n'a l'app ouverte)
function schedulePush(id, at, { title, body, to = null, tag }) {

  fetch(cfg.pushServer.replace(/\/$/, '') + '/schedule', {

function b64ToU8(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function registerPush() {
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(cfg.vapidPublic) });
  const r = await fetch(cfg.pushServer.replace(/\/$/, '') + '/subscribe', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: cfg.pushKey, user: S.me, subscription: sub.toJSON() }),
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Serveur injoignable');
  localStorage.setItem('maison.push', S.me);

function pushState() {
  if (!pushReady()) return 'noserver';
  if (isIOS && !standalone) return 'install';
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  if (Notification.permission === 'granted' && localStorage.getItem('maison.push')) return 'on';

}

/* ---------- état des pièces ---------- */
// Occupation sans heure de fin ("J'y vais") : se termine avec "J'ai terminé",
// ou toute seule au bout de OPEN_MAX si on a oublié.
const OPEN_MAX = { sdb: 2 * HOUR, bureau: 8 * HOUR };
function bookings(now = Date.now()) {
  return S.bookings.map(b => {
    if (!b.open) return b;
    const cap = b.start + (OPEN_MAX[b.room] || 2 * HOUR);
    return now >= cap ? { ...b, end: cap, auto: true } : { ...b, end: now + 1 };
  });
}
function roomStatus(room, now = Date.now()) {
  const list = bookings(now).filter(b => b.room === room && b.end > now).sort((a, b) => a.start - b.start);
  const cur = list.find(b => b.start <= now);
  const next = list.find(b => b.start > now);
  return { cur, next };
}
function strip(room, day, showNow = true) {
  const s = day + 6 * HOUR, e = day + 24 * HOUR, span = e - s, now = Date.now();
  const blocks = bookings().filter(b => b.room === room && b.end > s && b.start < e).map(b => {
    const a = Math.max(b.start, s), z = Math.min(b.end, e);
    return `<i style="left:${((a - s) / span * 100).toFixed(2)}%;width:${((z - a) / span * 100).toFixed(2)}%;background:${member(b.user).color}"></i>`;
  }).join('');
  const nowMark = showNow && now > s && now < e ? `<b style="left:${((now - s) / span * 100).toFixed(2)}%"></b>` : '';
  return `<div class="strip" aria-hidden="true">${blocks}${nowMark}</div><div class="ticks" aria-hidden="true"><span>6h</span><span>9h</span><span>12h</span><span>15h</span><span>18h</span><span>21h</span><span>24h</span></div>`;
}
function slab(room, compact) {
  const { cur, next } = roomStatus(room);
  const R = ROOMS[room], today = dayStart(Date.now());
  let state, detail, busy = '', c = '';
  if (cur) {
    busy = ' busy'; c = member(cur.user).color;
    state = cur.user === S.me ? 'Toi' : esc(member(cur.user).name);
    if (cur.open) {
      detail = cur.user === S.me ? `Tu y es depuis ${fmtT(cur.start)}` : `Y est depuis ${fmtT(cur.start)}, sans heure de fin`;
      if (next && dayStart(next.start) === today) detail += `. ${next.user === S.me ? 'Tu as' : esc(member(next.user).name) + ' a'} réservé à ${fmtT(next.start)}`;
    } else {
      detail = cur.user === S.me ? `C'est ton créneau jusqu'à ${fmtT(cur.end)}` : `Y est jusqu'à ${fmtT(cur.end)}`;
      if (next && next.start - cur.end < 30 * MIN) detail += `, puis ${esc(nameOf(next.user))}`;
    }
  } else {
    state = 'Libre';
    detail = next && dayStart(next.start) === today
      ? `Jusqu'à ${fmtT(next.start)}, ensuite c'est ${esc(nameOf(next.user)).toLowerCase() === 'toi' ? 'ton tour' : esc(nameOf(next.user))}`
      : "Rien de prévu pour le reste de la journée";
  }
  return `<section class="slab${busy}" style="--c:${c}" aria-label="${R.name}">
    <div class="room"><span>${R.name}</span></div>
    ${compact ? `<button class="mini act" data-act="book" data-room="${room}" data-today="1">Réserver</button>` : ''}
    <div class="state">${state}</div>
    <p class="detail">${detail}</p>
    ${strip(room, today)}
    ${!cur ? `<button class="go" data-act="occupy" data-room="${room}">J'y vais</button>`
      : cur.user === S.me ? `<button class="go" data-act="finish" data-id="${cur.id}">J'ai terminé</button>` : ''}
  </section>`;
}

function dishStats() {
  const since = Date.now() - 30 * DAY;
  const st = Object.fromEntries(S.members.map(m => [m.id, { id: m.id, rempli: 0, lance: 0, vide: 0 }]));
  for (const l of S.dishlog) {
    if (st[l.user] && l.at >= since && l.type in st[l.user]) st[l.user][l.type]++;
  }
  const arr = Object.values(st);
  return { arr };
}
const WASH = 2 * HOUR; // durée du programme : passe tout seul à « À vider » ensuite
const dishDoc = () => {
  const d = { status: 'remplir', ...(S.dish || {}) };
  if (!DISH[d.status]) d.status = 'remplir';
  if (d.status === 'lance' && d.at && Date.now() - d.at >= WASH) { d.status = 'propre'; d.act = 'auto'; d.at += WASH; }
  return d;
};
// Ligne "qui a fait quoi, quand" sous l'état
function dishLine(d) {
  if (d.act === 'auto') return `Terminé tout seul, ${when(d.at)}`;
  if (!d.by) return '';
  const who = d.by === S.me ? 'toi' : esc(member(d.by).name);
  if (d.status === 'lance') return `Lancé par ${who}, ${when(d.at)}. Fini vers ${fmtT(d.at + WASH)}`;
  return `${DISH_LAST[d.act] || 'Mis à jour par'} ${who}, ${when(d.at)}`;
}
// Qui est censé agir maintenant, selon l'état et les rôles attitrés
// Celui qui lance : son propre rôle, sinon celui qui remplit
const launcher = d => d.roleLaunch || d.roleFill;
function dishDuty(d) {
  if (d.status === 'remplir') return { who: d.roleFill, verb: 'remplir' };
  if (d.status === 'propre') return { who: d.roleEmpty, verb: 'vider' };
  return null;
}
function dutyText(d) {

function sortTasks(list) {
  return [...list].sort((a, b) => (a.due ?? Infinity) - (b.due ?? Infinity) || (a.createdAt || 0) - (b.createdAt || 0));
}
function dueInfo(t) {
  if (!t.due) return '';
  const t0 = dayStart(Date.now()), diff = Math.round((t.due - t0) / DAY);
  if (diff < 0) return `<span class="late">En retard${diff === -1 ? ' (hier)' : ` (${-diff} jours)`}</span>`;
  return `<span>Pour ${dayName(t.due)}</span>`;
}
function taskRow(t) {
  const meta = [];
  if (!t.done) meta.push(dueInfo(t));
  if (t.recur) meta.push(`<span>${RECUR[t.recur]}</span>`);
  if (t.done) meta.push(`<span>Fait par ${esc(nameOf(t.doneBy))}, ${when(t.doneAt)}</span>`);
  else if (t.assignee) meta.push(`<span style="display:inline-flex;gap:5px;align-items:center">${av(t.assignee, 'sm')}${esc(nameOf(t.assignee))}</span>`);
  else meta.push('<span>Libre</span>');
  if (!t.done && t.recur && t.lastDoneBy) meta.push(`<span>Dernière fois : ${esc(nameOf(t.lastDoneBy))}, ${when(t.lastDoneAt)}</span>`);
  return `<li>
    <button class="check ${t.done ? 'done' : ''}" data-act="${t.done ? 'task-undo' : 'task-done'}" data-id="${t.id}" aria-label="${t.done ? 'Marquer comme pas faite' : 'Marquer comme faite'} : ${esc(t.title)}"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>
    <button class="tbody" data-act="task-edit" data-id="${t.id}"><div class="t">${esc(t.title)}</div><div class="m">${meta.filter(Boolean).join('')}</div></button>
    ${!t.done && !t.assignee ? `<button class="small" data-act="task-take" data-id="${t.id}">Je prends</button>` : ''}
    ${!t.done && t.assignee && t.assignee !== S.me && iAmParent() ? bellBtn('nudge-task', t.id, `Relancer ${member(t.assignee).name}`) : ''}
  </li>`;
}
function viewTaches() {

// locked : feuille obligatoire (création du code), impossible à fermer
function openSheet(html, mount, { locked = false } = {}) {
  const root = $('#sheet-root');
  root.innerHTML = `<div class="scrim" ${locked ? '' : 'data-act="close-sheet"'}></div>
    <div class="sheet" role="dialog" aria-modal="true"><div class="in"><div class="grab"></div>
    ${locked ? '' : `<button class="x" data-act="close-sheet" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`}
    ${html}</div></div>`;
  const sh = root.querySelector('.sheet');
  document.documentElement.classList.add('sheet-open');
  if (!locked) swipeToClose(sh);
  mount?.(sh);
}
const sheetOpen = () => !!$('#sheet-root').innerHTML;
const closeSheet = () => { $('#sheet-root').innerHTML = ''; document.documentElement.classList.remove('sheet-open'); };

// Glisser la feuille vers le bas pour la fermer (quand son contenu est tout en haut)
function swipeToClose(sh) {
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => {
    if (sh.scrollTop > 0 || e.target.closest('input')) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none';
  }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0) sh.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  sh.addEventListener('touchend', () => {
    if (y0 === null) return;
    y0 = null; sh.style.transition = 'transform .2s ease';
    if (dy > 90) { sh.style.transform = 'translateY(100%)'; setTimeout(closeSheet, 180); }
    else sh.style.transform = '';
  });
}

const DAYS_AHEAD = 8; // aujourd'hui + 7 jours
function bookingSheet(room, today) {
  const R = ROOMS[room];
  const t0 = dayStart(Date.now());
  let day = today ? t0 : S.day[room];
  let dur = R.dur;
  let startDefault = '07:00';
  if (day === t0) {
    // premier créneau libre à partir de maintenant (arrondi aux 5 minutes)
    const r5 = t => Math.ceil(t / (5 * MIN)) * 5 * MIN;
    let cand = r5(Date.now());
    for (let i = 0; i < 50; i++) {
      const clash = bookings().find(b => b.room === room && b.start < cand + dur * MIN && b.end > cand);
      if (!clash) break;
      cand = r5(clash.end);
    }
    const n = new Date(cand);
    startDefault = dayStart(cand) === day ? `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}` : '23:55';
  }
  const days = Array.from({ length: DAYS_AHEAD }, (_, i) => addDays(t0, i));
  const occ = roomStatus(room).cur;
  openSheet(`<h2>Réserver ${R.the}</h2>
    ${occ?.open && occ.user !== S.me ? `<p class="hint">${esc(member(occ.user).name)} occupe ${R.the} depuis ${fmtT(occ.start)}, sans heure de fin.</p>` : ''}
    <div class="field"><span>Jour</span><div class="scroller in-sheet" id="bk-day">${days.map(d =>
      `<button class="chip" data-d="${d}" aria-pressed="${d === day}">${cap(dayName(d))}</button>`).join('')}</div></div>
    <label class="field"><span>Début</span><input class="input" type="time" id="bk-start" value="${startDefault}" step="300"></label>
    <div class="field"><span>Durée</span><div class="chips" id="bk-dur">${DURATIONS.map(m => `<button class="chip" data-m="${m}" aria-pressed="${m === dur}">${m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? String(m % 60).padStart(2, '0') : '')}</button>`).join('')}</div></div>
    <p class="summary" id="bk-sum"></p><p class="err" id="bk-err"></p>
    <label class="field"><span>Note (facultatif)</span><input class="input" id="bk-note" maxlength="60" placeholder="${room === 'sdb' ? 'Ex. douche + cheveux' : 'Ex. appel visio, ne pas déranger'}"></label>
    <button class="btn" id="bk-go">Réserver</button>`, sh => {
    const startEl = sh.querySelector('#bk-start'), sum = sh.querySelector('#bk-sum'), err = sh.querySelector('#bk-err'), go = sh.querySelector('#bk-go');
    const compute = () => {
      const [h, m] = (startEl.value || '00:00').split(':').map(Number);
      const start = day + h * HOUR + m * MIN, end = start + dur * MIN;
      sum.textContent = `${fmtT(start)} → ${fmtT(end)}`;
      let msg = '';
      const clash = bookings().find(b => b.room === room && b.start < end && b.end > start);
      if (!startEl.value) msg = "Choisis une heure de début.";
      else if (end <= Date.now()) msg = 'Ce créneau est déjà passé.';
      else if (clash) msg = `Ça chevauche ${clash.user === S.me ? 'ta réservation' : 'la réservation de ' + member(clash.user).name} (${fmtT(clash.start)}–${fmtT(clash.end)}).`;
      err.textContent = msg; go.disabled = !!msg;
      return { start, end, ok: !msg };
    };
    sh.querySelector('#bk-dur').addEventListener('click', e => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      dur = +b.dataset.m; sh.querySelectorAll('#bk-dur .chip').forEach(c => c.setAttribute('aria-pressed', c === b)); compute();
    });
    sh.querySelector('#bk-day').addEventListener('click', e => {
      const b = e.target.closest('[data-d]'); if (!b) return;
      day = +b.dataset.d; sh.querySelectorAll('#bk-day .chip').forEach(c => c.setAttribute('aria-pressed', c === b)); compute();
    });
    startEl.addEventListener('input', compute);
    go.addEventListener('click', async () => {
      const { start, end, ok } = compute(); if (!ok) return;
      go.disabled = true;
      const note = sh.querySelector('#bk-note').value.trim();
      await store.add('bookings', { room, user: S.me, start, end, note, createdAt: Date.now() });
      S.day[room] = day;
      closeSheet(); render(); toast('Créneau réservé');
      notify({ title: `${R.name} réservé${room === 'sdb' ? 'e' : ''}`, body: `${meM().name} : ${dayName(day)} ${fmtT(start)}–${fmtT(end)}${note ? ` (${note})` : ''}`, tag: 'room-' + room });
    });
    compute();
  });
}

/* ---------- lave-vaisselle : passage d'un état à l'autre ---------- */
async function dishGo(act) {
  const d = dishDoc(), now = Date.now();
  if (!DISH[d.status].actions.some(([a]) => a === act)) return; // bouton périmé (état changé entre-temps)
  const helped = role => role && role !== S.me; // quelqu'un d'autre que le responsable l'a fait
  // Sans rôle attribué : tout le monde est prévenu. Sinon seulement les responsables (sauf moi).
  const notifyRoles = (ids, msg) => {
    const set = ids.filter(Boolean);
    if (!set.length) return notify(msg);
    const to = [...new Set(set.filter(x => x !== S.me))];
    if (to.length) notify({ ...msg, to });
  };
  const next = { fill: 'remplir', launch: 'lance', done: 'propre', empty: 'remplir' }[act];
  await store.setDoc('vaisselle', { status: next, act, by: S.me, at: now });
  if (act === 'fill') {
    // peut se faire plusieurs fois avant de lancer : pas de notification
    await store.add('dishlog', { type: 'rempli', user: S.me, at: now });
    toast(helped(d.roleFill) ? "Rempli, merci d'avoir dépanné" : 'Noté, merci');
  }
  if (act === 'launch') {
    await store.add('dishlog', { type: 'lance', user: S.me, at: now });
    toast(helped(launcher(d)) ? "Lancé, merci d'avoir dépanné" : `Lancé, fini vers ${fmtT(now + WASH)}`);
    scheduleDishEnd(d, now + WASH); // celui qui vide est prévenu à la fin du programme
  }
  if (act === 'done') {
    unschedulePush('dish'); // fini plus tôt : on prévient tout de suite
    toast('Noté : il est propre');
    notifyRoles([d.roleEmpty], { title: 'Lave-vaisselle propre', body: d.roleEmpty ? 'Tu peux le vider.' : 'Il faut le vider.', tag: 'dish' });
  }
  if (act === 'empty') {
    unschedulePush('dish');
    await store.add('dishlog', { type: 'vide', user: S.me, at: now });
    toast(helped(d.roleEmpty) ? "Vidé, merci d'avoir dépanné" : 'Merci, il est vidé');
    // prévient celui qui remplit, et celui qui devait vider s'il a été dépanné
    notifyRoles([d.roleFill, d.roleEmpty], { title: 'Lave-vaisselle vidé', body: `Par ${meM().name}. Il peut être rempli.`, tag: 'dish' });
  }
}

/* ---------- messages des parents ---------- */
const PRESETS = ['À table ! 🍽️', 'On mange dans 10 minutes', "Venez m'aider une minute", 'On part dans 5 minutes', 'Rangez vos chambres'];
// Par défaut les enfants ; si aucun rôle n'est défini, tous les autres
function defaultCallees() {
  const k = kids().filter(id => id !== S.me);
  return k.length ? k : S.members.filter(m => m.id !== S.me).map(m => m.id);
}
function callSheet() {
  const to = new Set(defaultCallees());
  let msg = PRESETS[0];
  openSheet(`<h2>Envoyer un message</h2><p class="lead">La notification arrive tout de suite sur leur téléphone.</p>
    <div class="field"><span>À qui ?</span><div class="chips" id="cl-to">${S.members.filter(m => m.id !== S.me).map(m =>
      `<button class="chip" data-v="${m.id}" aria-pressed="${to.has(m.id)}"><span class="dot" style="background:${m.color}"></span>${esc(m.name)}</button>`).join('')}</div></div>
    <div class="field"><span>Message</span><div class="chips" id="cl-pre">${PRESETS.map((p, i) =>
      `<button class="chip" data-i="${i}" aria-pressed="${i === 0}">${esc(p)}</button>`).join('')}</div>
      <input class="input" id="cl-txt" maxlength="120" placeholder="Ou écris ton propre message" style="margin-top:10px"></div>
    <button class="btn" id="cl-go">Envoyer</button>`, sh => {
    sh.querySelector('#cl-to').addEventListener('click', e => {
      const b = e.target.closest('[data-v]'); if (!b) return;
      to.has(b.dataset.v) ? to.delete(b.dataset.v) : to.add(b.dataset.v);
      b.setAttribute('aria-pressed', to.has(b.dataset.v));
    });
    const txt = sh.querySelector('#cl-txt'), pres = () => sh.querySelectorAll('#cl-pre .chip');
    sh.querySelector('#cl-pre').addEventListener('click', e => {
      const b = e.target.closest('[data-i]'); if (!b) return;
      msg = PRESETS[+b.dataset.i]; txt.value = '';
      pres().forEach(c => c.setAttribute('aria-pressed', c === b));
    });
    txt.addEventListener('input', () => {
      const v = txt.value.trim();
      if (v) { msg = v; pres().forEach(c => c.setAttribute('aria-pressed', 'false')); }
    });
    sh.querySelector('#cl-go').addEventListener('click', async () => {
      if (!to.size) { toast('Choisis au moins une personne'); return; }
      if (!txt.value.trim() && ![...pres()].some(c => c.getAttribute('aria-pressed') === 'true')) { toast('Choisis ou écris un message'); return; }
      closeSheet();
      await send([...to], `${meM().emoji} ${meM().name}`, msg, 'appel');
    });
  });
}

/* ---------- profil : avatar, couleur, code ---------- */
const EMOJIS = ['🦊', '🐻', '🐼', '🐸', '🐱', '🐶', '🐰', '🐨', '🦁', '🐯', '🐵', '🐧', '🦉', '🐢', '🐙', '🦄', '🐝', '🦋', '🐬', '🐳',
  '🌵', '🌻', '🍀', '🌙', '⭐', '🔥', '⚡', '🌈', '⚽', '🎮', '🎸', '🎧', '🚌', '🚀', '🍕', '🍩', '☕', '👑', '💎', '🎨'];
const PALETTE = ['#2F62C9', '#C2620E', '#B8336A', '#23855A', '#7448C4', '#0E7C86', '#B5372B', '#8A5A1F', '#475569', '#5F6F1E'];

async function updateMember(id, patch) {
  const list = S.members.map(m => m.id === id ? { ...m, ...patch } : m);
  S.members = list;
  await store.setDoc('membres', { list });
}
async function pinHash(id, pin) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`maison:${cfg.famille || 'maison'}:${id}:${pin}`));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

function profileSheet() {
  const m = meM();
  let emoji = m.emoji, color = m.color;
  openSheet(`<h2>Mon profil</h2>
    <div class="prof-preview"><span class="av xl" id="pf-av" style="--c:${color}">${esc(emoji)}</span></div>
    <label class="field"><span>Prénom</span><input class="input" id="pf-name" maxlength="20" value="${esc(m.name)}"></label>
    <div class="field"><span>Avatar</span>
      <div class="emojis" id="pf-emo">${EMOJIS.map(e => `<button data-e="${e}" aria-pressed="${e === emoji}">${e}</button>`).join('')}</div>
      <input class="input" id="pf-emo-free" maxlength="4" placeholder="Ou tape un autre emoji" style="margin-top:10px"></div>
    <div class="field"><span>Couleur</span>
      <div class="swatches" id="pf-col">${PALETTE.map(c => `<button data-c="${c}" style="--c:${c}" aria-pressed="${c === color}" aria-label="Couleur ${c}"></button>`).join('')}</div></div>
    <button class="btn" id="pf-save">Enregistrer</button>
    <button class="btn ghost" data-act="pin-change">Changer mon code</button>`, sh => {
    const avEl = sh.querySelector('#pf-av');
    sh.querySelector('#pf-emo').addEventListener('click', e => {
      const b = e.target.closest('[data-e]'); if (!b) return;
      emoji = b.dataset.e; avEl.textContent = emoji; sh.querySelector('#pf-emo-free').value = '';
      sh.querySelectorAll('#pf-emo button').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
    sh.querySelector('#pf-emo-free').addEventListener('input', e => {
      const v = e.target.value.trim(); if (!v) return;
      emoji = v; avEl.textContent = v; sh.querySelectorAll('#pf-emo button').forEach(x => x.setAttribute('aria-pressed', 'false'));
    });
    sh.querySelector('#pf-col').addEventListener('click', e => {
      const b = e.target.closest('[data-c]'); if (!b) return;

    sh.querySelector('#pf-save').addEventListener('click', async () => {
      const name = (sh.querySelector('#pf-name').value.trim() || m.name).slice(0, 20);
      await updateMember(S.me, { name, emoji, color }); closeSheet(); render(); toast('Profil enregistré');
    });
  });
}

// Pavé numérique : onPin(code) renvoie un message d'erreur, ou rien si c'est bon
function pinPad({ title, lead, locked = false, onPin }) {
  const del = '<svg viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6 6-6Z"/><path d="m12 10 4 4M16 10l-4 4"/></svg>';
  openSheet(`<h2>${title}</h2><p class="lead">${lead}</p>
    <div class="pin-dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
    <p class="err pin-err" id="pin-err"></p>
    <div class="pad" id="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
      <span></span><button data-k="0">0</button><button data-k="del" aria-label="Effacer">${del}</button></div>`, sh => {
    let v = '', busy = false;
    const dotsBox = sh.querySelector('#pin-dots'), dots = [...dotsBox.children], err = sh.querySelector('#pin-err');
    const paint = () => dots.forEach((d, i) => d.classList.toggle('on', i < v.length));
    sh.querySelector('#pin-pad').addEventListener('click', async e => {
      const b = e.target.closest('[data-k]'); if (!b || busy) return;
      if (b.dataset.k === 'del') { v = v.slice(0, -1); paint(); return; }
      if (v.length >= 4) return;
      v += b.dataset.k; paint(); err.textContent = '';
      if (v.length < 4) return;
      busy = true;
      const msg = await onPin(v);
      busy = false;
      if (msg && sh.isConnected) {
        err.textContent = msg; dotsBox.classList.add('shake');
        setTimeout(() => dotsBox.classList.remove('shake'), 400);
        v = ''; paint();
      }
    });
  }, { locked });
}
function createPin(id, { locked = false, then } = {}) {
  const m = member(id);
  pinPad({
    title: `Crée le code de ${esc(m.name)}`, locked,
    lead: 'Choisis 4 chiffres et garde-les pour toi. Ce code sera demandé pour utiliser ce profil sur un téléphone.',
    onPin: async first => {
      pinPad({
        title: 'Confirme ton code', lead: 'Tape-le une deuxième fois.', locked,
        onPin: async second => {
          if (second !== first) { setTimeout(() => createPin(id, { locked, then }), 900); return 'Les deux codes ne correspondent pas. On recommence.'; }
          await updateMember(id, { pin: await pinHash(id, first) });
          closeSheet(); toast('Code enregistré'); then?.();
        },
      });
    },
  });
}
const tries = { n: 0, until: 0 };
function askPin(id, then) {
  const m = member(id);
  if (!m.pin) { createPin(id, { then }); return; }
  pinPad({
    title: `Code de ${esc(m.name)}`, lead: 'Tape le code de ce profil.',
    onPin: async pin => {
      if (Date.now() < tries.until) return `Trop d'essais. Réessaie dans ${Math.ceil((tries.until - Date.now()) / 1000)} secondes.`;
      if (await pinHash(id, pin) === member(id).pin) { tries.n = 0; closeSheet(); then(); return; }
      if (++tries.n >= 5) { tries.n = 0; tries.until = Date.now() + 30000; }
      return 'Code incorrect.';
    },
  });
}
function becomeMe(id) {
  S.me = id; localStorage.setItem('maison.me', id); render(); toast(`Salut ${member(id).name}`);
  if (localStorage.getItem('maison.push') && 'Notification' in window && Notification.permission === 'granted') registerPush().catch(() => {});
}
// Profil choisi sur ce téléphone mais sans code : on oblige à en créer un
function requirePin() {
  if (S.me && S.members.some(m => m.id === S.me) && !meM().pin && !sheetOpen()) createPin(S.me, { locked: true });
}

/* ---------- actions ---------- */
const ACTIONS = {
  'close-sheet': closeSheet,
  'pick-me': d => askPin(d.id, () => becomeMe(d.id)),
  settings: settingsSheet,
  profile: profileSheet,
  'pin-change': () => askPin(S.me, () => createPin(S.me)),
  'switch-open': () => openSheet(`<h2>Changer de profil</h2><p class="lead">Le code du profil choisi sera demandé.</p>
    <ul class="rows">${S.members.filter(m => m.id !== S.me).map(m => `<li>${av(m.id)}<div class="grow"><div class="t">${esc(m.name)}</div></div>
      <button class="small" data-act="switch-to" data-id="${m.id}">Choisir</button></li>`).join('')}</ul>`),
  'switch-to': d => askPin(d.id, () => becomeMe(d.id)),
  'set-role': async d => {
    if (!canSetRoles()) return;
    await updateMember(d.id, { role: d.r }); render(); settingsSheet();
  },
  'call-meal': () => send(defaultCallees(), `${meM().emoji} ${meM().name}`, 'À table ! 🍽️', 'appel'),
  'call-open': callSheet,
  'nudge-dish': () => {
    const x = dishDuty(dishDoc()); if (!x?.who || !iAmParent()) return;
    nudge('dish', [x.who], `Rappel de ${meM().name}`, `Le lave-vaisselle est à ${x.verb}.`);
  },
  'nudge-task': d => {
    const t = S.tasks.find(x => x.id === d.id); if (!t || !iAmParent()) return;
    const to = t.assignee ? [t.assignee] : defaultCallees();
    nudge('task-' + t.id, to, `Rappel de ${meM().name}`, t.assignee ? `N'oublie pas : ${t.title}` : `Tâche libre à faire : ${t.title}`);
  },
  'push-on': async (d, el) => {
    el.disabled = true; el.textContent = 'Activation…';
    try {
      const p = await Notification.requestPermission();
      if (p !== 'granted') throw new Error("Tu n'as pas autorisé les notifications.");
      await registerPush(); toast('Notifications activées'); settingsSheet();
    } catch (e) { el.disabled = false; el.textContent = 'Activer les notifications'; toast(e.message || 'Échec'); }
  },
  'push-test': () => { notify({ title: 'Maison', body: 'Les notifications fonctionnent sur ce téléphone.', to: [S.me], tag: 'test' }); toast('Notification envoyée'); },
  'demo-reset': () => { localStorage.removeItem('maison.demo.v1'); location.reload(); },
  book: d => bookingSheet(d.room, !!d.today),
  'pick-day': d => { S.day[d.room] = +d.day; render(); },
  occupy: async d => {
    const room = d.room, R = ROOMS[room], now = Date.now();
    const { cur, next } = roomStatus(room, now);
    if (cur) { toast(`${R.name} déjà occupé${room === 'sdb' ? 'e' : ''}`); render(); return; }
    await store.add('bookings', { room, user: S.me, start: now, end: null, open: true, note: '', createdAt: now });
    const soon = next && next.user !== S.me && next.start - now < 2 * HOUR;
    toast(soon ? `Attention : ${member(next.user).name} a réservé à ${fmtT(next.start)}` : `${cap(R.the)} est à toi`);
    notify({ title: `${R.name} occupé${room === 'sdb' ? 'e' : ''}`, body: `${meM().name} y est, sans heure de fin.`, tag: 'room-' + room });
  },
  finish: async d => {
    const b = bookings().find(x => x.id === d.id); if (!b) return;
    const now = Date.now(), R = ROOMS[b.room];
    await store.update('bookings', b.id, { open: false, end: now });
    toast(`${R.name} libérée`.replace('Bureau libérée', 'Bureau libéré'));
    notify({ title: `${R.name} libre`, body: `${meM().name} a terminé.`, tag: 'room-' + b.room });
  },
  'cancel-booking': async d => {
    const b = bookings().find(x => x.id === d.id); if (!b) return;
    if (!confirm(`Annuler ton créneau de ${fmtT(b.start)} à ${fmtT(b.end)} ?`)) return;
    await store.remove('bookings', b.id); toast('Créneau annulé');
    notify({ title: `${ROOMS[b.room].name} : créneau libéré`, body: `${meM().name} a annulé ${dayName(dayStart(b.start))} ${fmtT(b.start)}–${fmtT(b.end)}`, tag: 'room-' + b.room });
  },
  dish: d => dishGo(d.a),
  'dish-role': d => {
    const R = {
      fill: ['roleFill', 'Qui remplit ?', 'Personne'],
      launch: ['roleLaunch', 'Qui lance ?', 'Comme pour remplir'],
      empty: ['roleEmpty', 'Qui vide ?', 'Personne'],
    }[d.r];
    const [key, title, none] = R, cur = dishDoc()[key] || '';
    openSheet(`<h2>${title}</h2><p class="lead">Les autres pourront toujours dépanner.</p>
      <div class="chips">${S.members.map(m => `<button class="chip" data-act="dish-role-set" data-k="${key}" data-id="${m.id}" aria-pressed="${cur === m.id}"><span class="dot" style="background:${m.color}"></span>${esc(m.name)}</button>`).join('')}
      <button class="chip" data-act="dish-role-set" data-k="${key}" data-id="" aria-pressed="${!cur}">${none}</button></div>`);
  },
  'dish-role-set': async d => { await store.setDoc('vaisselle', { [d.k]: d.id || null }); closeSheet(); toast('Rôle enregistré'); },
  'dish-fix': () => openSheet(`<h2>Corriger l'état</h2><p class="lead">Sans rien ajouter à l'historique.</p>
    ${Object.entries(DISH).map(([k, v]) => `<button class="btn ghost" data-act="dish-set" data-s="${k}">${v.state}</button>`).join('')}`),
  'dish-set': async d => {
    const now = Date.now();
    await store.setDoc('vaisselle', { status: d.s, act: null, by: S.me, at: now });
    unschedulePush('dish');
    if (d.s === 'lance') scheduleDishEnd(dishDoc(), now + WASH);
    closeSheet();
  },
  'task-filter': d => { S.taskFilter = d.f; render(); },
  'goto-free': () => { S.taskFilter = 'libres'; location.hash = 'taches'; },
  'task-new': () => taskSheet(null),
  'task-edit': d => taskSheet(S.tasks.find(t => t.id === d.id)),
  'task-take': async d => { await store.update('tasks', d.id, { assignee: S.me }); toast("C'est pour toi"); },
  'task-done': async d => {
    const t = S.tasks.find(x => x.id === d.id); if (!t) return;
    const now = Date.now();
    if (t.recur) {
      const nextDue = addPeriod(Math.max(t.due ?? 0, dayStart(now)), t.recur);
      await store.update('tasks', t.id, { due: nextDue, lastDoneBy: S.me, lastDoneAt: now });
      toast(`Fait. Prochaine fois : ${dayName(nextDue)}`);
    } else {
      await store.update('tasks', t.id, { done: true, doneBy: S.me, doneAt: now });
      toast('Bravo, une de moins');
    }
  },
  'task-undo': async d => { await store.update('tasks', d.id, { done: false, doneBy: null, doneAt: null }); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el);
});
addEventListener('hashchange', () => { S.view = location.hash.slice(1) || 'accueil'; render(); scrollTo(0, 0); });
setInterval(() => { if (!sheetOpen()) render(); }, 30 * 1000);

/* ---------- rafraîchissement ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function refreshData() {
  await Promise.race([store?.refresh?.(), sleep(5000)]).catch(() => {});
  await sleep(400);
  render();
}
// Retour dans l'app après un moment en arrière-plan : on resynchronise sans rien demander
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  render();
  if (hiddenAt && Date.now() - hiddenAt > 15000) refreshData();
});
// Tirer la page vers le bas pour rafraîchir
(() => {
  const ptr = $('#ptr');
  let y0 = null, d = 0, busy = false;
  const reset = () => { ptr.style.transform = ''; ptr.style.opacity = 0; ptr.classList.remove('armed', 'spin'); };
  addEventListener('touchstart', e => {
    y0 = (busy || sheetOpen() || scrollY > 0 || !S.me) ? null : e.touches[0].clientY; d = 0;
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 === null) return;
    if (scrollY > 0) { y0 = null; reset(); return; }
    d = Math.min(Math.max(0, e.touches[0].clientY - y0) * 0.5, 90);
    ptr.style.transform = `translate(-50%, ${d - 46}px)`;
    ptr.style.opacity = Math.min(1, d / 50);
    ptr.classList.toggle('armed', d >= 60);
  }, { passive: true });
  addEventListener('touchend', async () => {
    if (y0 === null) return;
    y0 = null;
    if (!ptr.classList.contains('armed')) { reset(); return; }
    busy = true; ptr.classList.add('spin'); ptr.style.transform = 'translate(-50%, 18px)';
    await refreshData();
    busy = false; reset(); toast('Tout est à jour');
  });
})();

/* ---------- démarrage ---------- */
let cleaned = false;
function cleanup() {
  if (cleaned) return; cleaned = true;
  const now = Date.now();
  bookings().filter(b => b.end < now - 7 * DAY).forEach(b => store.remove('bookings', b.id));
  S.tasks.filter(t => t.done && t.doneAt < now - 30 * DAY).forEach(t => store.remove('tasks', t.id));
  S.dishlog.filter(l => l.at < now - 90 * DAY).forEach(l => store.remove('dishlog', l.id));
}
async function start() {
  try { store = DEMO ? localStore() : await firestoreStore(); }
  catch (e) {
    $('#app').innerHTML = `<div class="loading" style="text-align:center;padding:0 20px"><div><h1 style="font-family:var(--display)">Connexion impossible</h1><p class="muted">Vérifie la configuration Firebase dans config.js et que la connexion anonyme est activée.</p><p class="muted" style="font-size:13px">${esc(e.message)}</p></div></div>`;
    return;
  }
  let pending = 5;
  const ready = () => {
    if (pending > 0 && --pending === 0) { S.loaded = true; setTimeout(cleanup, 3000); setTimeout(requirePin, 1500); }
    render();
  };
  store.listenDoc('membres', d => { if (d?.list?.length) S.members = d.list; ready(); });
  store.listenDoc('vaisselle', d => { S.dish = d; ready(); });
  store.listen('bookings', l => { S.bookings = l; ready(); });
  store.listen('tasks', l => { S.tasks = l; ready(); });
  store.listen('dishlog', l => { S.dishlog = l; ready(); });
  if (S.me && pushState() === 'on' && localStorage.getItem('maison.push.day') !== String(dayStart(Date.now()))) registerPush().catch(() => {});
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
start();
</script>
